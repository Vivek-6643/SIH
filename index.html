        function login(userType) {
            switch (userType) {
                case 'student':
                    renderStudentLoginPage();
                    break;
                case 'industry':
                    renderIndustryLoginPage();
                    break;
                case 'faculty':
                    renderFacultyLoginPage();
                    break;
                case 'alumni':
                    renderAlumniLoginPage();
                    break;
                default:
                    showRoleSelection();
            }
        }

        function showLogin() {
            currentUser = null;
            loginScreen.classList.remove('hidden');
            dashboard.classList.add('hidden');
            dashboard.classList.remove('flex');
            showRoleSelection();
        }

        function setupDashboard(userType) {
            const userTypeKey = userType === 'alumni' ? 'alumni_user' : userType;
            // Populate nav links
            navLinks.innerHTML = navConfig[userType]
                .map((link, index) => `
                    <a href="#" data-view="${link.view}" class="sidebar-link ${index === 0 ? 'active' : ''} flex items-center space-x-3 py-2 px-4 rounded-lg" onclick="switchView('${link.view}', this)">
                        <i class="fas ${link.icon}"></i>
                        <span>${link.text}</span>
                    </a>
                `).join('');

            // Set user welcome message
            const userData = mockData[userTypeKey];
            userWelcome.textContent = `Welcome, ${userData.name}!`;

            if (userType === 'student') {
                renderNotifications();
            }

            // Load initial view
            switchView(navConfig[userType][0].view, navLinks.children[0]);
        }
        
        function switchView(view, element) {
            // Update header title based on view, handling custom views
             let linkText = 'Prashiskshan'; // Default title
            if (view === 'internshipPostedConfirmation') {
                linkText = 'Confirmation';
            } else {
                const linkConfig = navConfig[currentUser].find(l => l.view === view);
                if (linkConfig) {
                    linkText = linkConfig.text;
                }
            }
            headerTitle.textContent = linkText;


            // Update active link
            document.querySelectorAll('.sidebar-link').forEach(link => link.classList.remove('active'));
            if(element) {
                element.classList.add('active');
            }


            // Render content
            contentArea.innerHTML = renderView(view);
        }
        
        // --- Gemini API Integration ---
        function showModal(title, body) {
            geminiModalTitle.innerHTML = title;
            geminiModalBody.innerHTML = body;
            geminiModal.classList.remove('hidden');
            setTimeout(() => {
                geminiModalOverlay.classList.remove('opacity-0');
                geminiModalOverlay.classList.add('opacity-100');
                const content = geminiModal.querySelector('.modal-content');
                if (content) {
                    content.classList.remove('scale-95');
                    content.classList.add('scale-100');
                }
            }, 10);
        }

        function closeModal() {
            geminiModalOverlay.classList.remove('opacity-100');
            geminiModalOverlay.classList.add('opacity-0');
            const content = geminiModal.querySelector('.modal-content');
            if (content) {
                content.classList.remove('scale-100');
                content.classList.add('scale-95');
            }
            setTimeout(() => {
                geminiModal.classList.add('hidden');
            }, 300);
        }
        
        async function callGeminiAPI(prompt, context) {
            const systemPrompt = "You are a helpful assistant for the Prashiskshan platform, an interface between academia and industry. Your responses should be professional, encouraging, and constructive.";
            const userQuery = `${prompt}\n\nContext:\n${context}`;
            const apiKey = ""; // Canvas will provide this.
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-05-20:generateContent?key=${apiKey}`;

            const payload = {
                contents: [{ parts: [{ text: userQuery }] }],
                systemInstruction: { parts: [{ text: systemPrompt }] },
            };
            
            // This is a mock API call for demonstration.
            console.log("Calling Gemini API with payload:", payload);
            showModal('✨ AI Assistant is thinking...', '<div class="flex justify-center items-center p-8"><i class="fas fa-spinner fa-spin text-4xl text-blue-600"></i></div>');
            return new Promise(resolve => {
                setTimeout(() => {
                    const mockResponse = `
                        <div class="p-4 text-center">
                             <i class="fas fa-info-circle text-3xl text-blue-500 mb-4"></i>
                             <p class="font-medium text-lg">This section will work in the developed software, not in the prototype.</p>
                        </div>
                    `;
                    resolve({ text: () => Promise.resolve(mockResponse) });
                }, 1000);
            });
        }
        
        function handleProfileReview() {
            const context = `Student Name: ${mockData.student.name}, Skills: ${mockData.student.profile.skills.join(', ')}, Projects: ${mockData.student.profile.projects}`;
            callGeminiAPI("Please review this student's profile and provide constructive feedback for improvement.", context)
                .then(res => res.text())
                .then(text => {
                     showModal('✨ AI Profile Review', text);
                });
        }

        function handleGenerateDescription() {
            const title = document.getElementById('internship-title-input').value || "Frontend Developer Intern";
            const skills = document.getElementById('internship-skills-input').value || "React, JavaScript, HTML/CSS";
            const context = `Internship Title: ${title}, Required Skills: ${skills}`;
            callGeminiAPI("Generate a compelling internship description based on the following details.", context)
                .then(res => res.text())
                .then(text => {
                     showModal('✨ AI Generated Description', text);
                });
        }
        
         function handleApplicantSummary(applicantIndex) {
            const applicant = mockData.industry.applicants[applicantIndex];
            const context = `Applicant Name: ${applicant.name}, Skills: ${applicant.skills}, Projects: ${applicant.projects}`;
            callGeminiAPI("Provide a brief, two-sentence summary of this applicant's strengths and suitability for an internship.", context)
                .then(res => res.text())
                .then(text => {
                    showModal(`✨ AI Summary: ${applicant.name}`, text);
                });
        }
        
        function applyForInternship(internshipIndex) {
            const internship = mockData.internships[internshipIndex];
            
            // Check if already applied to prevent duplicates
            const alreadyApplied = mockData.student.applications.some(app => app.company === internship.company && app.role === internship.role);

            if (alreadyApplied) {
                showModal('Already Applied', `<div class="text-center p-4"><p>You have already applied for the <strong>${internship.role}</strong> position at <strong>${internship.company}</strong>.</p></div>`);
                return;
            }

            const newApplication = {
                id: mockData.student.applications.length + 1,
                company: internship.company,
                role: internship.role,
                status: "Applied",
                appliedOn: new Date().toISOString().split('T')[0],
                lastUpdate: new Date().toISOString().split('T')[0],
                history: [{ date: new Date().toISOString().split('T')[0], note: "Application submitted." }]
            };

            mockData.student.applications.unshift(newApplication); // Add to the top of the list

            showModal('Success!', `
                <div class="text-center p-4">
                    <i class="fas fa-check-circle text-4xl text-green-500 mb-4"></i>
                    <p class="text-lg font-medium">You have successfully applied for the</p>
                    <p class="font-bold text-xl text-blue-700">${internship.role}</p>
                    <p class="text-md">at ${internship.company}.</p>
                    <p class="mt-4 text-sm text-gray-500">Redirecting to your applications...</p>
                </div>
            `);

            // Redirect after a delay
            setTimeout(() => {
                closeModal();
                // Find the correct sidebar link element to pass to switchView
                const sidebarLink = document.querySelector(".sidebar-link[data-view='studentApplications']");
                if (sidebarLink) {
                    switchView('studentApplications', sidebarLink);
                }
            }, 2500);
        }

        function showApplicationTracker(applicationId) {
            const application = mockData.student.applications.find(app => app.id === applicationId);
            if (!application) return;

            const trackerHtml = `
                <div class="space-y-4">
                    ${application.history.slice().reverse().map((event, index, arr) => `
                        <div class="flex items-start">
                            <div class="flex flex-col items-center mr-4">
                                <div class="w-4 h-4 rounded-full ${index === 0 ? 'bg-blue-500 ring-4 ring-blue-100' : 'bg-gray-300'}"></div>
                                ${index < arr.length - 1 ? '<div class="w-px h-12 bg-gray-300"></div>' : ''}
                            </div>
                            <div>
                                <p class="font-semibold text-gray-800">${event.date}</p>
                                <p class="text-gray-600">${event.note}</p>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;

            showModal(`<i class="fas fa-clipboard-list mr-2"></i> Tracker: ${application.role}`, trackerHtml);
        }

        function performSearch() {
            const keywords = document.getElementById('search-keywords').value.toLowerCase();
            const location = document.getElementById('search-location').value.toLowerCase();
            const listContainer = document.getElementById('internship-list');

            const filteredInternships = mockData.internships.filter(internship => {
                const matchesKeywords = keywords === '' ||
                    internship.role.toLowerCase().includes(keywords) ||
                    internship.company.toLowerCase().includes(keywords) ||
                    internship.skills.some(skill => skill.toLowerCase().includes(keywords));

                const matchesLocation = location === '' ||
                    internship.location.toLowerCase().includes(location);

                return matchesKeywords && matchesLocation;
            });

            if (filteredInternships.length > 0) {
                listContainer.innerHTML = filteredInternships.map(job => {
                    const originalIndex = mockData.internships.findIndex(i => i.company === job.company && i.role === job.role);
                    return `
                        <div class="bg-white p-6 rounded-xl shadow-md hover:shadow-lg transition">

                            <p class="text-gray-600 font-medium">${job.company}</p>

                </div>
            `;

        function renderNotifications() {
            const notifications = mockData.student.notifications;
            const unreadCount = notifications.filter(n => !n.read).length;

            if (notificationBadge) {
                notificationBadge.textContent = unreadCount;
                if(unreadCount === 0) notificationBadge.classList.add('hidden');
                else notificationBadge.classList.remove('hidden');
            }

            if (notificationList) {
                notificationList.innerHTML = notifications.map(n => `
                    <a href="#" class="flex items-start px-4 py-3 hover:bg-gray-50 ${!n.read ? 'bg-blue-50' : ''}">
                        <div class="flex-shrink-0 h-8 w-8 rounded-full bg-${n.color}-100 flex items-center justify-center mr-3">
                            <i class="fas ${n.icon} text-${n.color}-500"></i>
                        </div>
                        <div class="w-full">
                            <p class="text-gray-600 text-sm">${n.text}</p>
                            <p class="text-xs text-gray-400 mt-1">${n.time}</p>
                        </div>
                    </a>
                `).join('');
            }
        }
        
        // Mobile Menu Toggle
        document.getElementById('menu-button').addEventListener('click', () => {
            document.getElementById('sidebar').classList.toggle('-translate-x-full');
        });

        // Notification Dropdown Toggle
        notificationButton.addEventListener('click', (event) => {
            event.stopPropagation();
            notificationPanel.classList.toggle('hidden');
        });

        document.addEventListener('click', (event) => {
            if (!notificationPanel.contains(event.target) && !notificationButton.contains(event.target)) {
                notificationPanel.classList.add('hidden');
            }
        });
